# The agents' demo project: Orchestra, the task system, an AI reviewer (Claude Code, Haiku) and a
# program worker (machines/shell_worker.py) on the same queue. demo/run.py copies this folder to
# a fresh git repository and starts everything; see README.md.

[events]
url = "file"             # Orchestra's bus: a JSONL file in ~/.orchestrator/<key>/

[metrics]
url = "file"

[discovery]
window = "60m"
step = "30s"
every = "5m"

# ---- the task system (orchestra-tasking; sections Orchestra itself ignores) ----

[project]
base_branch = "main"
ticket_prefix = "DEMO"
work = "tasks"           # a scratch folder per ticket, reviewed, nothing merged

[tasks]
workers = 2              # tickets offered to workers at once
reviewers = 1

# ---- the agents (orchestra-agents) ----

[agents]
harness = "claude_code"  # pi | claude_code | codex
model = "haiku"          # the cheapest model: a review is a short turn
serves = ["reviewer"]    # the worker role is the shell worker's, a program
