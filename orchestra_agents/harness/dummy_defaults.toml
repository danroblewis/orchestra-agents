# The dummy harness's built-in rules (dummy_script.py): what each built-in role does when the
# project's script has no rule for the turn. They make a working team on their own: a worker
# that does a token piece of work and reports it ready, a reviewer that approves, a Supervisor
# that hands a chat message to the Coordinator, a Coordinator that plans it into a milestone and a
# ticket, and any other turn that does nothing.

# A code ticket: a file of the ticket's own (so two tickets' branches land side by side), committed.
[[rule]]
role = "worker"
checkout = true
steps = [
  { write = "work/{ticket}.md", text = "Work on {ticket}, turn {turn}, by the dummy worker.\n", append = true },
  { commit = "{ticket}: dummy work" },
  { tool = "report_ticket", args = { state = "READY_FOR_REVIEW", summary = "The dummy worker wrote work/{ticket}.md and committed it." } },
]
reply = "Done; reported ready for review."

# A task: the result in the ticket's folder.
[[rule]]
role = "worker"
steps = [
  { write = "RESULT.md", text = "# {ticket}\n\nThe dummy worker's result, turn {turn}.\n" },
  { tool = "report_ticket", args = { state = "READY_FOR_REVIEW", summary = "The dummy worker wrote RESULT.md." } },
]
reply = "Done; reported ready for review."

[[rule]]
role = "reviewer"
steps = [
  { tool = "report_review", args = { verdict = "APPROVED", summary = "The dummy reviewer approves." } },
]
reply = "Approved."

# The first run (first_run.py): a scripted Supervisor cannot read the repository, so it sets
# nothing and says how to get one that can.
[[rule]]
role = "supervisor"
prompt = "\\[First run: set up this project\\]"
steps = [{ tool = "list_guides" }]
reply = "I am a scripted Supervisor (the dummy harness): I cannot read your repository, so I set nothing up. Install Claude Code and log in once (run claude), then restart orchestra run, and I will set the project up on Claude Code with Haiku; or tell a real Supervisor to set [agents] harness and model."

# A standing instruction in the chat ("from now on, ..."): a duty of its own, as the Supervisor's fixed core says.
[[rule]]
role = "supervisor"
prompt = "(?s)\\[The human's message\\]\\s*(?i:from now on),?\\s*(?P<duty>.+)"
steps = [{ tool = "add_duty", args = { name = "owner_duty_{turn}", text = "The owner asked, in their words: from now on, {match.duty}", about = "{match.duty}", reason = "The owner said: from now on, {match.duty}" }, keep = "d" }]
reply = "That is a standing duty of mine now ({kept.d.duty}, commit {kept.d.commit}). (I am a scripted Supervisor: the dummy harness.)"

# Orchestra's follow-up to a reply it read as an unkept promise (promises.follow_up): the reply's
# tools already did what it said.
[[rule]]
role = "supervisor"
prompt = "\\[Orchestra: your reply says"
reply = "Done above."

# One of the human's tickets landed (landings.py): told to the human.
[[rule]]
role = "supervisor"
prompt = "(?s)ticket (?P<ticket>\\S+) \\((?P<title>[^\\n]*?)\\), which was made for the human's request, is DONE: (?P<how>[^.\\n]*)"
reply = "{match.ticket} ({match.title}) is done: {match.how}. (I am a scripted Supervisor: the dummy harness.)"

# The human asks for another harness or model: a scripted Supervisor cannot change it, and nothing is handed on.
[[rule]]
role = "supervisor"
prompt = "(?s)\\[The human's message\\].*(?i:\\b(?:harness|claude|haiku|sonnet|opus)\\b|\\b(?:use|switch to|change|another) (?:the |a )?model\\b)"
reply = "I am a scripted Supervisor (the dummy harness): I cannot change the harness. Install Claude Code and log in once (run claude), then restart orchestra run."

# A chat message without the task system: the Coordinator plans into tickets, which only the
# tasking plugin keeps, so nothing is handed on; the reply says so and what would do the work.
[[rule]]
role = "supervisor"
prompt = "\\[The human's message\\]"
tasking = false
reply = "I am a scripted Supervisor (the dummy harness), and I changed nothing: I cannot do the work myself, and the Coordinator I would hand it to plans requests into tickets, which need the tasking plugin (orchestra-tasking), not installed here. For the work to be done, install Claude Code and log in once (run claude), then restart orchestra run: a real Supervisor starts it as an item on a workflow (request_work), and the Items page follows it."

# A chat message with the task system: handed to the Coordinator as the human's requirements, as a real Supervisor does.
[[rule]]
role = "supervisor"
prompt = "\\[The human's message\\]"
tasking = true
steps = [{ tool = "hand_to_coordinator", args = { requirements = "The human asked for this, in their words: {message}", context = "Handed on by the scripted Supervisor (the dummy harness), word for word." }, keep = "h" }]
reply = "I handed your request to the Coordinator as {kept.h.request}; it plans it into tickets and I will tell you the plan. (I am a scripted Supervisor: the dummy harness.)"

# The Coordinator's plan comes back: told to the human.
[[rule]]
role = "supervisor"
prompt = "(?s)event work.planned request=(?P<request>r-[0-9a-f]+): .*?Plan: (?P<plan>.*?) Milestone: (?P<milestone>[^.\\s]+)\\. Tickets: (?P<tickets>[^\\n]*?)\\."
reply = "The Coordinator planned your request {match.request}: {match.plan} Milestone {match.milestone}; tickets {match.tickets}. I will tell you when they are done."

[[rule]]
role = "supervisor"
reply = "I am a scripted Supervisor (the dummy harness): I have no scripted answer for this."

# The Supervisor's hand-off: one milestone and one ticket with the requirements, reported back.
[[rule]]
role = "coordinator"
prompt = "event work.requested request=(?P<request>r-[0-9a-f]+)[^\\n]*\\nrequirements: (?P<requirements>(?:The human asked for this, in their words: )?(?P<title>[^\\s.!?]+(?: [^\\s.!?]+){0,7})[^\\n]*)"
steps = [
  { tool = "create_milestone", args = { name = "{match.title}", description = "The human's request ({match.request}), handed on by the Supervisor." }, keep = "m" },
  { tool = "create_ticket", args = { title = "{match.title}", objective = "The human's request, handed on by the Supervisor.", description = "{match.requirements}", acceptance = "- The result does what the request asks.", verification = "The reviewer reads the result.", milestone_id = "{kept.m.milestone.id}" }, keep = "t" },
  { tool = "report_plan", args = { request = "{match.request}", summary = "One ticket for the request.", milestone = "{kept.m.milestone.id}", tickets = ["{kept.t.ticket.id}"] } },
]
reply = "Planned {match.request}: milestone {kept.m.milestone.id}, ticket {kept.t.ticket.id}."

[[rule]]
role = "*"
reply = "Nothing to do."
