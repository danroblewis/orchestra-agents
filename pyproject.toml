[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra-agents"
version = "0.1.0"
description = "AI agents as Orchestra machines: harnesses (Pi, Claude Code, Codex), sessions, prompts, roles and teams; they fill a task system's roles over Orchestra's bus."
requires-python = ">=3.12"
dependencies = ["orchestra"]

[project.optional-dependencies]
# orchestra-tasking: the e2e tests and the demo run the real task system beside the agents;
# orchestra[sd]: they start `orchestra run`, whose host rediscovers the model from the metrics.
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "orchestra-tasking", "orchestra[sd]"]

[project.scripts]
orchestra-agents = "orchestra_agents.cli:main"

[project.entry-points."orchestra.plugins"]
agents = "orchestra_agents.web:plugin"

[tool.uv.sources]
orchestra = { path = "../orchestra_2", editable = true }
orchestra-tasking = { path = "../orchestra-tasking", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["orchestra_agents"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
pythonpath = ["tests", "."]          # tests import conftest and the fakes; the demo e2e test imports demo.run

[tool.ruff]
line-length = 100
target-version = "py312"
