[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra-agents"
version = "0.1.0"
description = "AI agents as Orchestra machines: harnesses (Pi, Claude Code, Codex), sessions, prompts, roles and teams; they fill a task system's roles over Orchestra's bus."
requires-python = ">=3.12"
# orchestra: ours is 1.0.0a1; <1.0.0 keeps out the unrelated `orchestra` on PyPI (1.0.0 and up)
dependencies = ["orchestra>=1.0.0a1,<1.0.0", "psutil", "fastapi"]   # the host reads processes, the web plugin is a FastAPI router;
# configuration is read and changed only through Orchestra (project.orchestra.config, config_edit)

[project.optional-dependencies]
# orchestra-tasking: the e2e tests and the demo run the real task system beside the agents;
# orchestra[sd]: they start `orchestra run`, whose host rediscovers the model from the metrics.
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6",
       "orchestra-tasking @ git+ssh://git@github.com/danroblewis/orchestra-tasking",
       "orchestra[sd]"]

[project.entry-points."orchestra.commands"]
agents = "orchestra_agents.cli:main"   # `orchestra agents ...` (PLUGINS.md §4.10): no executable of its own

[project.entry-points."orchestra.plugins"]
agents = "orchestra_agents.web:plugin"

[tool.hatch.metadata]
allow-direct-references = true   # the dev extra takes orchestra-tasking from GitHub (a git URL)

[tool.uv.sources]
# This repository's own environment takes Orchestra from GitHub (README, "Developing against a local Orchestra");
# ignored when the plugin is installed as a dependency.
orchestra = { git = "https://github.com/danroblewis/orchestra", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["orchestra_agents"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]
pythonpath = ["tests", "."]          # tests import conftest and the fakes; the demo e2e test imports demo.run

[tool.ruff]
line-length = 100
target-version = "py312"
